[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adc-logger"
version = "0.1.0"
description = "Python logging configuration with JSON formatting and colored output"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = ["logging", "json", "structured-logging", "colorlog"]
authors = [
    { name = "ascet.dev" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "colorlog>=6.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "mypy>=1.5.1",
    "ruff>=0.0.284",
]

[project.urls]
Homepage = "https://github.com/ascet-dev/adc-logger"
Repository = "https://github.com/ascet-dev/adc-logger"
Issues = "https://github.com/ascet-dev/adc-logger/issues"

[tool.hatch.build.targets.wheel]
packages = ["adc_logger"]
